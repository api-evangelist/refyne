name: Refyne
description: >-
  Refyne is an Indian financial wellness platform and the country's first earned wage
  access (EWA) provider, letting employees draw a portion of their already-earned salary
  before payday at 0% interest through their employer's payroll. Founded in 2020 and
  backed by QED Investors, Refyne serves 500+ organizations across 23 industries and
  more than 8 million employees, and operates additional products including RuPay credit
  cards, the MoneyGuru financial-literacy service, and an employee privilege/discount
  club. The company operates under RBI compliance and holds ISO 27001 and SOC 2
  certifications. Refyne is primarily a B2B2C mobile and payroll-integrated platform and
  does not publish a public developer portal or API at this time; this profile captures
  its public identity and domain-security posture.
